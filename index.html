<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan David & Oktiya</title>

    <!-- Metadata WhatsApp Preview -->
    <meta property="og:title" content="Undangan Pernikahan David & Oktiya">
    <meta property="og:description" content="Kami mengundang Anda untuk hadir di acara pernikahan kami.">
    <meta property="og:image" content="foto1.webp">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }

        /* Hero / Sampul Depan */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('foto1.webp') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 20px 40px;
            text-align: center;
            color: #ffffff;
        }

        .hero h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .btn-open {
            padding: 12px 28px;
            background: #d4af37;
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .btn-open:hover {
            background: #b5922f;
        }

        /* Section Umum */
        .section {
            padding: 40px 20px;
            text-align: center;
        }

        .section h2 {
            color: #d4af37;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        /* Mempelai */
        .mempelai-card {
            margin-bottom: 30px;
        }

        .mempelai-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            border: 4px solid #d4af37;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Galeri / Our Moments */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .gallery-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            object-position: center;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Sampul Utama (Sebelum Buka Undangan) -->
        <section class="hero">
            <div>
                <p style="text-transform: uppercase; letter-spacing: 2px;">The Wedding Of</p>
                <h1>David & Oktiya</h1>
            </div>
            <div>
                <button class="btn-open" onclick="document.getElementById('konten-utama').scrollIntoView({behavior: 'smooth'});">
                    ✉ Buka Undangan
                </button>
            </div>
        </section>

        <!-- Konten Utama -->
        <div id="konten-utama">

            <!-- Section Mempelai -->
            <section class="section">
                <h2>Mempelai</h2>
                
                <!-- Mempelai Wanita -->
                <div class="mempelai-card">
                    <img src="wanita.webp" alt="Foto Mempelai Wanita" class="mempelai-img" loading="lazy">
                    <h3>Oktiya</h3>
                </div>

                <!-- Mempelai Pria -->
                <div class="mempelai-card">
                    <img src="pria.webp" alt="Foto Mempelai Pria" class="mempelai-img" loading="lazy">
                    <h3>David</h3>
                </div>
            </section>

            <!-- Section Our Moments (Galeri) -->
            <section class="section" style="background-color: #faf8f5;">
                <h2>Our Moments</h2>
                <div class="gallery-grid">
                    <img src="foto2.webp" alt="Moment 1" class="gallery-img" loading="lazy">
                    <img src="foto3.webp" alt="Moment 2" class="gallery-img" loading="lazy">
                    <img src="foto4.webp" alt="Moment 3" class="gallery-img" loading="lazy">
                    <img src="foto5.webp" alt="Moment 4" class="gallery-img" loading="lazy">
                    <img src="foto6.webp" alt="Moment 5" class="gallery-img" loading="lazy">
                </div>
            </section>

        </div>

    </div>

</body>
</html>
